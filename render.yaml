services:
  # --------------------------------------------------------------------------
  # NeuroVault Backend (FastAPI + ChromaDB + LangChain RAG)
  # --------------------------------------------------------------------------
  - type: web
    name: neurovault-rag
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    rootDir: neurovault/backend
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements-render.txt && python -c "from chromadb.utils.embedding_functions import ONNXMiniLM_L6_V2; ONNXMiniLM_L6_V2()"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: USE_ONNX_EMBEDDINGS
        value: "true"

  # --------------------------------------------------------------------------
  # NeuroVault Frontend (React + Vite SPA)
  # --------------------------------------------------------------------------
  - type: web
    name: neurovault-frontend
    runtime: static
    region: oregon
    plan: free
    autoDeploy: true
    rootDir: neurovault/frontend
    buildCommand: bun install && bun run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: neurovault-rag
          property: host
